name: road_accident_danger_zone_alert
description: A Flutter app that alerts drivers when they approach high-risk accident zones.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  http: ^1.2.2
  firebase_core: ^3.8.0
  firebase_database: ^11.1.6
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  google_polyline_algorithm: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/accident_zones.json
